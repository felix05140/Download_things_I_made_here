<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>download files lol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000000;
    font-family: 'Silkscreen', monospace;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 20px;
    position: relative;
  }

  /* ===== 상단 타이틀 (여기 문구 수정) ===== */
  .title {
    color: #ffffff;
    font-size: clamp(20px, 4vw, 34px);
    text-align: center;
    margin: 0 0 120px 0;
  }

  /* ===== 트리 구조 ===== */
  .tree {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .node-btn {
    background: #000000;
    color: #ff2b1c;
    border: 3px solid #ff2b1c;
    font-family: 'Silkscreen', monospace;
    padding: 18px 26px;
    font-size: clamp(16px, 2.4vw, 22px);
    line-height: 1.6;
    cursor: pointer;
    text-align: center;
    box-shadow: none;
  }

  .node-btn:hover {
    background: #1a0000;
  }

  .children {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 40px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.25s ease;
  }

  .children.show {
    opacity: 1;
    max-height: 400px;
  }

  .branch {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 세로선: 부모 -> 자식 */
  .branch::before {
    content: "";
    position: absolute;
    top: -40px;
    left: 50%;
    width: 2px;
    height: 40px;
    background: #ff2b1c;
  }

  .child-link {
    display: block;
    background: #000000;
    color: #ff2b1c;
    border: 3px solid #ff2b1c;
    font-family: 'Silkscreen', monospace;
    text-decoration: none;
    padding: 12px 20px;
    font-size: clamp(14px, 2vw, 18px);
    text-align: center;
    white-space: nowrap;
  }

  .child-link:hover {
    background: #1a0000;
  }

  /* ===== 하단 서명 (여기 이름 수정) ===== */
  .signature {
    position: fixed;
    bottom: 16px;
    left: 20px;
    color: #7a7a7a;
    font-family: 'Silkscreen', monospace;
    font-size: 15px;
  }

  .cursor-blink {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

  <h1 class="title">Literally just a site to download files lol</h1>

  <div class="tree">
    <button class="node-btn" id="mainBtn" onclick="revealChildren()">
      Download my c00l things(?)
    </button>

    <!--
      ▼▼▼ 여기 수정하세요 ▼▼▼
      href 에 실제 다운로드 링크(파일 URL)를 넣고, 텍스트(Notepad, Problems)는 원하는 이름으로 바꾸세요.
      버튼을 더 추가하고 싶으면 .branch 블록 통째로 복사해서 children 안에 붙여넣으면 됩니다.
    -->
    <div class="children" id="childrenBox">
      <div class="branch">
        <a class="child-link" href="https://drive.google.com/uc?export=download&id=1jbC6_Fg6ThKnUB8z7cXU6KVvqI7-u-X-" download>Notepad</a>
      </div>
      <div class="branch">
        <a class="child-link" href="https://drive.google.com/uc?export=download&id=10lFIjJzNfD3DdJiTNSCQM9VgnosHtuMh" download>Problems</a>
      </div>
    </div>
  </div>

  <div class="signature">Made by F3L1X_<span class="cursor-blink">_</span></div>

  <script>
    function revealChildren() {
      document.getElementById('childrenBox').classList.toggle('show');
    }
  </script>

</body>
</html>
